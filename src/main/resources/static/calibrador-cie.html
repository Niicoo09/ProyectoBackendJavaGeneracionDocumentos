<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calibrador Universal de Plantillas - Tramidocs</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0f172a; font-family: 'Inter', system-ui, -apple-system, sans-serif; display: flex; color: #f8fafc; height: 100vh; overflow: hidden; }
        
        #editor-panel {
            width: 340px;
            background: #1e293b;
            border-right: 1px solid #334155;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
            flex-shrink: 0;
        }
        
        #editor-panel h3 { font-size: 15px; font-weight: 700; margin-bottom: 12px; border-bottom: 1px solid #334155; padding-bottom: 8px; color: #38bdf8; text-transform: uppercase; letter-spacing: 0.05em; }
        
        .selector-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .selector-group label {
            font-size: 11px;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
        }

        .selector-group select {
            background: #0f172a;
            border: 1px solid #334155;
            color: #f8fafc;
            padding: 8px 12px;
            font-size: 12px;
            border-radius: 6px;
            cursor: pointer;
            outline: none;
        }

        select optgroup {
            background: #1e293b;
            color: #38bdf8;
            font-weight: bold;
            font-style: normal;
            font-size: 11px;
            padding: 4px;
        }

        select option {
            background: #0f172a;
            color: #f8fafc;
            font-weight: normal;
            font-size: 12px;
            padding: 4px;
        }

        .page-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 20px;
        }
        .page-selector button {
            padding: 6px 10px;
            background: #334155;
            border: none;
            color: #f8fafc;
            font-weight: bold;
            font-size: 11px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .page-selector button.active {
            background: #0284c7;
            box-shadow: 0 0 8px rgba(2, 132, 199, 0.4);
        }

        .field-group { margin-bottom: 12px; display: flex; flex-direction: column; background: #0f172a; padding: 10px; border-radius: 6px; border: 1px solid #334155; }
        .field-group label { font-size: 10px; font-weight: 600; margin-bottom: 6px; color: #38bdf8; }
        .controls { display: flex; gap: 4px; align-items: center; }
        .controls input {
            background: #1e293b; border: 1px solid #334155; color: #f8fafc;
            padding: 4px; font-size: 11px; width: 55px; border-radius: 4px; text-align: center;
        }
        .controls button {
            background: #0284c7; border: none; color: #fff; width: 24px; height: 24px;
            border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
        }
        .controls button:hover { background: #0369a1; }

        #workspace { flex: 1; overflow: auto; display: flex; justify-content: center; align-items: flex-start; padding: 25px; background: #0f172a; }
        
        #page-container {
            width: 210mm;
            height: 297mm;
            background-size: 100% 100%;
            background-repeat: no-repeat;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            background-color: #fff;
        }

        .overlay-field {
            position: absolute;
            color: #ea580c;
            font-family: Arial, sans-serif;
            font-size: 7.5pt;
            font-weight: normal;
            line-height: 1;
            white-space: nowrap;
            cursor: pointer;
            outline: 1px dashed rgba(234, 88, 12, 0.5);
            padding: 0 0.5mm;
            background: rgba(254, 243, 199, 0.7);
            user-select: none;
        }
        .overlay-field:hover, .overlay-field.active {
            outline-color: #dc2626;
            background: rgba(254, 226, 226, 0.9);
            color: #991b1b;
            z-index: 100;
        }

        .overlay-marker {
            position: absolute;
            font-size: 6pt;
            font-weight: bold;
            color: #dc2626;
            font-family: Arial, sans-serif;
            transform: translate(-50%, -50%);
            outline: 1px dashed rgba(220, 38, 38, 0.5);
            cursor: pointer;
            user-select: none;
        }
        .overlay-marker:hover, .overlay-marker.active {
            outline-color: #0284c7;
            z-index: 100;
        }

        #export-btn {
            background: #16a34a; border: none; color: #fff; padding: 12px; margin-top: 15px;
            border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; text-transform: uppercase;
            letter-spacing: 0.5px; transition: background 0.2s; width: 100%;
        }
        #export-btn:hover { background: #15803d; }

        #save-btn {
            background: #0e7490; border: none; color: #fff; padding: 12px; margin-top: 8px;
            border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; text-transform: uppercase;
            letter-spacing: 0.5px; transition: background 0.2s; width: 100%;
        }
        #save-btn:hover { background: #0891b2; }
        #save-btn:disabled { background: #334155; cursor: not-allowed; opacity: 0.6; }

        #save-status {
            margin-top: 6px; font-size: 11px; font-weight: 600; min-height: 18px;
            text-align: center; border-radius: 4px; padding: 4px 6px;
            transition: all 0.3s;
        }
        
        #code-output {
            margin-top: 15px; width: 100%; height: 380px !important; min-height: 300px !important; background: #020617; color: #22c55e;
            font-family: monospace; font-size: 11px; border: 1px solid #334155; padding: 10px;
            resize: vertical; border-radius: 6px; outline: none;
        }
    </style>
</head>

                <optgroup label="Legalización">

                    <option value="dr-do">Declaración Resp. Dirección Obra</option>
                    <option value="dr-tecnico">Declaración Resp. Técnico Competente</option>
                </optgroup>
            </select>
        </div>

        <h3>Páginas</h3>
        <div class="page-selector" id="pages-container">
            <!-- Cargado dinámicamente -->
        </div>
        
        <p style="font-size: 10px; margin-bottom: 12px; color: #94a3b8; line-height: 1.4;">
            Haz clic en un campo sobre el papel para activarlo. Puedes arrastrarlo libremente o ajustarlo de 0.5mm en 0.5mm.
        </p>
        
        <button id="export-btn">Copiar Fragmento Thymeleaf</button>
        <button id="save-btn">&#128190; Guardar en Plantilla</button>
        <div id="save-status"></div>
        <textarea id="code-output" readonly placeholder="El código Thymeleaf aparecerá aquí..."></textarea>

        <div id="fields-controls-container" style="margin-top: 15px;">
            <!-- Rellenado dinámicamente -->

    </div>

                        { id: "dt_prov_sup", label: "Provincia Cabecera", x: 140, y: 20.5, text: "Sevilla", isMarker: false, bind: "${form['provinciaSelect1'] ?: ''}" },
                        { id: "dt_firma_prov", label: "Firma Provincia", x: 58, y: 199, text: "Sevilla", isMarker: false, bind: "${form['provincia'] ?: ''}" },
                        { id: "dt_firma_dia", label: "Firma Día", x: 103, y: 199, text: "09", isMarker: false, bind: "${form['dia'] ?: ''}" },
                        { id: "dt_firma_mes", label: "Firma Mes", x: 118, y: 199, text: "Julio", isMarker: false, bind: "${form['mes'] ?: ''}" },
                        { id: "dt_firma_anio", label: "Firma Año", x: 145, y: 199, text: "2026", isMarker: false, bind: "${form['anio'] ?: ''}" },
                        
                        { id: "dt_firma_nom", label: "Nombre Firmante", x: 80, y: 224, text: "EDUARDO RIVERA CABEZAS", isMarker: false, bind: "${form['nombreFirma'] ?: ''}" },
                        { id: "dt_prov_inf", label: "Provincia Pie", x: 171, y: 232, text: "Sevilla", isMarker: false, bind: "${form['provinciaSelect2'] ?: ''}" }

        const container = document.getElementById('page-container');
        const controlsContainer = document.getElementById('fields-controls-container');
        const pagesContainer = document.getElementById('pages-container');

        window.switchTemplate = function(templateId) {
            currentTemplate = templateId;
            currentPage = 1;
            activeField = null;
            
            // Re-renderizar los botones de páginas
            pagesContainer.innerHTML = '';
            const tData = templatesData[templateId];
            
            // Aplicar tamaño del contenedor según plantilla para escala exacta
            const pageContainerEl = document.getElementById('page-container');
            pageContainerEl.style.width = tData.width || "210mm";
            pageContainerEl.style.height = tData.height || "297mm";
            pageContainerEl.style.backgroundSize = tData.bgSize || "100% 100%";

            for (let i = 1; i <= tData.totalPages; i++) {
                const btn = document.createElement('button');
                btn.id = `btn-page-${i}`;
                btn.textContent = `Pág ${i}`;
                btn.onclick = () => window.switchPage(i);
                if (i === 1) btn.className = 'active';
                pagesContainer.appendChild(btn);
            }

            window.switchPage(1);
        };

        function normalizeBind(bindStr) {
            if (!bindStr) return "";
            return bindStr.replace(/[\s'"`?:{}$]/g, "").replace("?:''", "").replace("?:\"\"", "");
        }

        function parseCoordinatesFromHtml(htmlContent) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlContent, 'text/html');
            const spans = doc.querySelectorAll('span.overlay-field, span.overlay-marker');
            
            const currentFields = templatesData[currentTemplate].fields[currentPage] || [];
            
            spans.forEach(span => {
                const style = span.getAttribute('style') || "";
                const leftMatch = style.match(/left:\s*([\d.]+)\s*mm/i);
                const topMatch = style.match(/top:\s*([\d.]+)\s*mm/i);
                if (!leftMatch || !topMatch) return;
                
                const xVal = parseFloat(leftMatch[1]);
                const yVal = parseFloat(topMatch[1]);
                
                // Intentar encontrar el bind en el HTML
                let bindVal = "";
                const thText = span.getAttribute('th:text');
                const thIf = span.getAttribute('th:if');
                
                if (thText) {
                    bindVal = thText;
                } else if (thIf) {
                    bindVal = thIf;
                }
                
                const normBind = normalizeBind(bindVal);
                
                // Buscar coincidencia en campos locales
                let matchedField = null;
                if (normBind) {
                    // Match por binding normalizado
                    matchedField = currentFields.find(f => normalizeBind(f.bind) === normBind);
                }
                
                if (matchedField) {
                    matchedField.x = xVal;
                    matchedField.y = yVal;
                }
            });
        }

        window.switchPage = async function(pageNumber) {
            currentPage = pageNumber;
            activeField = null;
            
            // Alternar clases activas de los botones de página
            const tData = templatesData[currentTemplate];
            for (let i = 1; i <= tData.totalPages; i++) {
                const btn = document.getElementById(`btn-page-${i}`);
                if (btn) btn.className = i === pageNumber ? 'active' : '';
            }
            
            // Cambiar imagen de fondo
            const bgImage = `/${tData.imagePrefix}${pageNumber}.jpg`;
            document.getElementById('page-container').style.backgroundImage = `url('${bgImage}')`;
            
            // Cargar posiciones reales desde el archivo HTML de la plantilla en el backend
            try {
                const statusEl = document.getElementById('save-status');
                statusEl.textContent = '⏳ Cargando posiciones desde plantilla...';
                statusEl.style.color = '#38bdf8';
                
                const token = localStorage.getItem('token');
                const response = await fetch(`/api/doc-generator/calibrador/cargar?templateId=${currentTemplate}&page=${pageNumber}`, {
                    headers: {
                        'Authorization': token ? `Bearer ${token}` : ''
                    }
                });
                if (response.ok) {
                    const data = await response.json();
                    if (data.html) {
                        parseCoordinatesFromHtml(data.html);
                        statusEl.textContent = '✅ Posiciones cargadas de plantilla';
                        statusEl.style.color = '#4ade80';
                        setTimeout(() => { if (statusEl.textContent.includes('posiciones')) statusEl.textContent = ''; }, 2000);
                    }
                } else {
                    statusEl.textContent = '⚠️ Usando coordenadas locales (sin archivo en backend)';
                    statusEl.style.color = '#fbbf24';
                }
            } catch (err) {
                console.error("Error al cargar coordenadas del backend:", err);
                const statusEl = document.getElementById('save-status');
                statusEl.textContent = '⚠️ Usando coordenadas locales (sin conexión)';
                statusEl.style.color = '#fbbf24';
            }
            
            renderWorkspace();
        };

        window.adjust = function(id, axis, val) {
            const fields = templatesData[currentTemplate].fields[currentPage] || [];
            const field = fields.find(f => f.id === id);
            if (field) {
                field[axis] = Math.round((field[axis] + val) * 2) / 2;
                updateVisual(field);
            }
        };

        window.inputChange = function(id, axis, val) {
            const fields = templatesData[currentTemplate].fields[currentPage] || [];
            const field = fields.find(f => f.id === id);
            if (field) {
                field[axis] = parseFloat(val) || 0;
                updateVisual(field);
            }
        };

        window.autoExport = function() {
            let html = "";
            const fields = templatesData[currentTemplate].fields[currentPage] || [];
            fields.forEach(field => {
                if (field.isMarker) {
                    let thIf = field.bind ? ' ' + field.bind : '';
                    html += `    <!-- ${field.label} -->\n`;
                    html += `    <span class="overlay-marker"${thIf} style="left:${field.x}mm; top:${field.y}mm;">X</span>\n\n`;
                } else {
                    let thText = '';
                    if (field.bind) {
                        const match = field.bind.match(/\['([^']+)'\]/);
                        if (match) {
                            thText = `\n          th:text="\${form['${match[1]}'] ?: ''}"`;
                        } else if (field.bind.startsWith('$') || field.bind.startsWith('th:')) {
                            thText = `\n          th:text="${field.bind}"`;
                        } else {
                            thText = `\n          th:text="\${form['${field.bind}'] ?: ''}"`;
                        }
                    }
                    if (field.bind && field.bind.includes('domicilio')) {
                        thText = `\n          th:text="${field.bind}"`;
                    } else if (field.bind && field.bind.includes('tensionNominalInversor')) {
                        thText = `\n          th:text="\${form['tensionNominalInversor'] ?: '230'}"`;
                    }
                    let textNode = field.bind ? '' : field.text;
                    html += `    <!-- ${field.label} -->\n`;
                    html += `    <span class="overlay-field" style="left:${field.x}mm; top:${field.y}mm; font-size:7.5pt;"${thText}>${textNode}</span>\n\n`;
                }
            });
            document.getElementById('code-output').value = html;
        };

        function renderWorkspace() {
            container.innerHTML = '';
            controlsContainer.innerHTML = '';
            
            const fields = templatesData[currentTemplate].fields[currentPage] || [];

            fields.forEach(field => {
                // Elemento visual
                const el = document.createElement('div');
                el.id = 'visual_' + field.id;
                el.className = field.isMarker ? 'overlay-marker' : 'overlay-field';
                el.textContent = field.text;
                el.style.left = field.x + 'mm';
                el.style.top = field.y + 'mm';
                container.appendChild(el);

                el.addEventListener('click', (e) => {
                    selectField(field);
                    e.stopPropagation();
                });

                // Drag & Drop
                let isDragging = false;
                let startX, startY;
                let originalX, originalY;

                el.addEventListener('mousedown', (e) => {
                    isDragging = true;
                    selectField(field);
                    startX = e.clientX;
                    startY = e.clientY;
                    originalX = field.x;
                    originalY = field.y;
                    e.stopPropagation();
                    e.preventDefault();
                });

                document.addEventListener('mousemove', (e) => {
                    if (!isDragging) return;
                    const dx = (e.clientX - startX) / 3.7795;
                    const dy = (e.clientY - startY) / 3.7795;
                    
                    field.x = Math.round((originalX + dx) * 2) / 2;
                    field.y = Math.round((originalY + dy) * 2) / 2;
                    
                    updateVisual(field);
                });

                document.addEventListener('mouseup', () => {
                    isDragging = false;
                });

                // Controles en el Panel Lateral
                const group = document.createElement('div');
                group.className = 'field-group';
                group.innerHTML = `
                    <label>${field.label} (${field.id})</label>
                    <div class="controls">
                        <button onclick="window.adjust('${field.id}', 'x', -0.5)">◀</button>
                        <input type="text" id="input_x_${field.id}" value="${field.x}" onchange="window.inputChange('${field.id}', 'x', this.value)">
                        <button onclick="window.adjust('${field.id}', 'x', 0.5)">▶</button>
                        <button onclick="window.adjust('${field.id}', 'y', -0.5)">▲</button>
                        <input type="text" id="input_y_${field.id}" value="${field.y}" onchange="window.inputChange('${field.id}', 'y', this.value)">
                        <button onclick="window.adjust('${field.id}', 'y', 0.5)">▼</button>
                    </div>
                `;
                controlsContainer.appendChild(group);
            });
            
            window.autoExport();
        }

        function selectField(field) {
            if (activeField) {
                const el = document.getElementById('visual_' + activeField.id);
                if (el) el.classList.remove('active');
            }
            activeField = field;
            const visualEl = document.getElementById('visual_' + field.id);
            if (visualEl) visualEl.classList.add('active');
        }

        function updateVisual(field) {
            const el = document.getElementById('visual_' + field.id);
            if (el) {
                el.style.left = field.x + 'mm';
                el.style.top = field.y + 'mm';
            }
            
            const ix = document.getElementById('input_x_' + field.id);
            const iy = document.getElementById('input_y_' + field.id);
            if (ix) ix.value = field.x;
            if (iy) iy.value = field.y;
            
            window.autoExport();
        }

        document.getElementById('export-btn').addEventListener('click', () => {
            const codeOutput = document.getElementById('code-output');
            codeOutput.select();
            document.execCommand('copy');
            const statusEl = document.getElementById('save-status');
            statusEl.textContent = '✅ Código copiado al portapapeles';
            statusEl.style.color = '#4ade80';
            setTimeout(() => { statusEl.textContent = ''; }, 2500);
        });

        document.getElementById('save-btn').addEventListener('click', async () => {
            const html = document.getElementById('code-output').value;
            const statusEl = document.getElementById('save-status');
            const saveBtn = document.getElementById('save-btn');

            if (!html.trim()) {
                statusEl.textContent = '⚠️ Primero pulsa "Copiar Fragmento Thymeleaf" para generar el código';
                statusEl.style.color = '#fbbf24';
                return;
            }

            if (!['cie-ext', 'mtd-ext'].includes(currentTemplate)) {
                statusEl.textContent = '⚠️ Guardado solo disponible para CIE Ext y MTD Ext';
                statusEl.style.color = '#fbbf24';
                return;
            }

            saveBtn.disabled = true;
            statusEl.textContent = '⏳ Guardando en servidor...';
            statusEl.style.color = '#38bdf8';

            try {
                const backendUrl = '/api/doc-generator/calibrador/guardar';
                const token = localStorage.getItem('token');
                const response = await fetch(backendUrl, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': token ? `Bearer ${token}` : ''
                    },
                    body: JSON.stringify({
                        templateId: currentTemplate,
                        page: currentPage,
                        html: html
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    statusEl.textContent = '✅ ' + data.message;
                    statusEl.style.color = '#4ade80';
                } else {
                    statusEl.textContent = '❌ ' + (data.error || 'Error desconocido del servidor');
                    statusEl.style.color = '#f87171';
                }
            } catch (err) {
                statusEl.textContent = '❌ Sin conexión con el servidor Spring Boot';
                statusEl.style.color = '#f87171';
            } finally {
                saveBtn.disabled = false;
            }
        });
        
        // Inicialización
        window.switchTemplate("cie-ext");
    </script>
