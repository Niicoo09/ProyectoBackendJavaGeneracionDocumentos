<div th:fragment="content(fondoStyle)" class="pagina-documento" th:style="${fondoStyle}">

    <!-- Primer Apellido -->
    <span class="overlay-field" data-cal-id="asi_interesado_apellido1" style="left:48mm; top:60.5mm; font-size:7.5pt;"
          th:text="${form['primerApellido'] ?: ''}"></span>

    <!-- Segundo Apellido -->
    <span class="overlay-field" data-cal-id="asi_interesado_apellido2" style="left:99.5mm; top:60.5mm; font-size:7.5pt;"
          th:text="${form['segundoApellido'] ?: ''}"></span>

    <!-- Nombre / Razón Social -->
    <span class="overlay-field" data-cal-id="asi_interesado_nombre" style="left:152mm; top:59.5mm; font-size:7.5pt;"
          th:text="${form['apellidosNombre'] ?: ''}"></span>

    <!-- NIF/CIF -->
    <span class="overlay-field" data-cal-id="asi_interesado_nif" style="left:14mm; top:60mm; font-size:7.5pt;"

    <!-- Tipo Vía -->
    <span class="overlay-field" data-cal-id="asi_tipo_via" style="left:13.5mm; top:73mm; font-size:7.5pt;"

    <span class="overlay-field" data-cal-id="asi_nombre_via" style="left:36.5mm; top:73mm; font-size:7.5pt;"

    <!-- Tipo Núm. -->
    <span class="overlay-field" data-cal-id="asi_tipo_num" style="left:144mm; top:73mm; font-size:7.5pt;"

    <span class="overlay-field" data-cal-id="asi_puerta" style="left:64mm; top:82.5mm; font-size:7.5pt;"

    <span class="overlay-field" data-cal-id="asi_interesado_provincia" style="left:134mm; top:82mm; font-size:7.5pt;"
          th:text="${form['provinciaEmplazamiento'] ?: ''}"></span>

    <!-- Municipio -->
    <span class="overlay-field" data-cal-id="asi_interesado_municipio" style="left:14mm; top:91mm; font-size:7.5pt;"
          th:text="${form['localidadEmplazamiento'] ?: ''}"></span>

    <span class="overlay-field" data-cal-id="asi_interesado_localidad" style="left:89.5mm; top:91mm; font-size:7.5pt;"

    <span class="overlay-field" data-cal-id="asi_codigo_postal" style="left:136.5mm; top:91mm; font-size:7.5pt;"

    <span class="overlay-field" data-cal-id="asi_tel_fijo1" style="left:68mm; top:99.5mm; font-size:7.5pt;"

    <span class="overlay-field" data-cal-id="asi_movil" style="left:80mm; top:80mm; font-size:7.5pt;"

    <span class="overlay-field" data-cal-id="asi_interesado_email" style="left:129.5mm; top:100mm; font-size:7.5pt;"
          th:text="${form['email'] ?: ''}"></span>

</div>
